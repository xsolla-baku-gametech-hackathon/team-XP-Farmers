name: Desktop app builds
on:
  push:
    branches: [twitch-chat]
    paths: ['desktop/**', 'tests/desktop.test.mjs', '.github/workflows/desktop.yml']
  pull_request:
    paths: ['desktop/**', 'tests/desktop.test.mjs', '.github/workflows/desktop.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            args: --mac zip --arm64 --x64
            name: macOS
          - os: windows-latest
            args: --win nsis --x64
            name: Windows
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - run: node --test tests/desktop.test.mjs
      - run: npm ci
        working-directory: desktop
      - run: npm run dist -- ${{ matrix.args }}
        working-directory: desktop
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - uses: actions/upload-artifact@v4
        with:
          name: XP-Farmers-Chat-${{ matrix.name }}
          if-no-files-found: error
          path: |
            desktop/dist/*.zip
            desktop/dist/*.exe
            desktop/dist/*.blockmap
